<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>카테고리별 통계</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Chart.js - 차트 그리는 라이브러리 -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <!-- 차트 위에 라벨(금액, %) 표시하는 플러그인 -->
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="/">나의 가계부</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <div class="ms-auto mt-2 mt-md-0 d-flex flex-column flex-md-row gap-1">
                        <a href="/cards" class="btn btn-outline-light btn-sm">카드 관리</a>
                        <a href="/calendar" class="btn btn-outline-light btn-sm">캘린더</a>
                        <a href="/stats" class="btn btn-outline-light btn-sm">카테고리 통계</a>
                        <a href="/budget" class="btn btn-outline-light btn-sm">예산 설정</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="row">

                <!-- 원형 차트 -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">이번 달 카테고리별 지출</h5>
                            <!-- 차트가 그려질 캔버스 -->
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 카테고리별 목록 -->
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">상세 내역</h5>
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>카테고리</th>
                                        <th>지출 합계</th>
                                    </tr>
                                </thead>
                                <!-- 카테고리 이름에 이모지 매핑 -->
                                {% set emoji_map = {'식사': '🍚', '간식': '🍪', '쇼핑': '🛍️', '자동차': '🚗', '교통': '🚌', '의료': '💊', '기타': '📦'} %}
                                <tbody>
                                    {% for category, total in category_totals.items() %}
                                    <tr>
                                        <td>{{ emoji_map.get(category, '') }} {{ category }}</td>
                                        <td>{{ total }}원</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Jinja2에서 Python 데이터를 JS로 변환
            const labels = {{ category_totals.keys() | list | tojson }};
            const data = {{ category_totals.values() | list | tojson }};

            // 도넛 가운데 총 지출 금액 표시하는 플러그인
            const centerTextPlugin = {
                id: 'centerText',
                afterDraw(chart) {
                    const { ctx, chartArea: { width, height, left, top } } = chart;
                    const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                    const cx = left + width / 2;
                    const cy = top + height / 2;
                    ctx.save();
                    // 금액 (큰 글씨)
                    ctx.font = 'bold 26px sans-serif';
                    ctx.fillStyle = '#333';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(total.toLocaleString() + '원', cx, cy - 12);
                    // 총 사용 금액 (작은 글씨)
                    ctx.font = '13px sans-serif';
                    ctx.fillStyle = '#888';
                    ctx.fillText('총 사용 금액', cx, cy + 16);
                    ctx.restore();
                }
            };

            // 도넛 차트 생성
            new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                            '#9966FF', '#FF9F40', '#C9CBCF'
                        ]
                    }]
                },
                plugins: [centerTextPlugin, ChartDataLabels],
                options: {
                    plugins: {
                        datalabels: {
                            // 각 조각에 금액과 퍼센트 표시
                            formatter: (value, ctx) => {
                                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = ((value / total) * 100).toFixed(1);
                                return value.toLocaleString() + '원\n(' + percentage + '%)';
                            },
                            color: '#fff',
                            font: { weight: 'bold', size: 12 }
                        }
                    }
                }
            });
        </script>
    </body>
</html>
