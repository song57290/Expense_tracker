<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문자 내역 가져오기 — 확인</title>
    <link rel="icon" href="/static/icon-192.png?v=2" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .row-card { border-radius: 12px; border: 1.5px solid #eee; padding: 12px 14px; margin-bottom: 8px; background: white; transition: border-color 0.15s; }
        .row-card.excluded { opacity: 0.4; }
        .row-card input, .row-card select { font-size: 0.82rem; border-radius: 8px; }
        .row-num { font-size: 0.72rem; color: #bbb; min-width: 18px; }
    </style>
</head>
<body class="bg-light">
<div class="px-3 pt-3">
    <nav class="navbar mb-4" style="background:linear-gradient(135deg,#b088f9 0%,#7baff0 100%);border-radius:20px;padding:12px 20px;box-shadow:0 4px 20px rgba(123,107,224,0.3);">
        <a class="navbar-brand fw-bold fs-5" href="/" style="color:white;text-shadow:0 0 16px rgba(255,255,255,0.7);">나의 가계부</a>
        <a href="/" style="color:white;"><i class="bi bi-house" style="font-size:1.6rem;"></i></a>
    </nav>
</div>

<div class="container" style="max-width:700px;">
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title mb-1"><i class="bi bi-chat-text text-primary"></i> 내역 확인</h5>
            <p class="text-muted mb-3" style="font-size:0.85rem;">
                인식된 내역을 확인하고 수정한 뒤 가져오세요. 체크 해제하면 해당 항목은 제외됩니다.
            </p>

            <form action="/import/text/confirm" method="post">
                <input type="hidden" name="tmp" value="{{ tmp }}">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted" style="font-size:0.82rem;">{{ parsed | length }}건 인식됨</span>
                    <label style="font-size:0.82rem;cursor:pointer;">
                        <input type="checkbox" id="checkAll" checked> 전체 선택
                    </label>
                </div>

                {% for tx in parsed %}
                <div class="row-card" id="rowcard-{{ loop.index0 }}">
                    <div class="d-flex align-items-start gap-2 mb-2">
                        <input type="checkbox" name="include" value="{{ loop.index0 }}"
                               class="row-check form-check-input mt-1" checked>
                        <span class="row-num">{{ loop.index }}</span>
                        <div class="row g-2 flex-fill">
                            <div class="col-6 col-md-3">
                                <input type="date" name="date" value="{{ tx.date }}"
                                       class="form-control form-control-sm" required>
                            </div>
                            <div class="col-6 col-md-3">
                                <select name="type" class="form-select form-select-sm">
                                    <option value="expense" {{ 'selected' if tx.type == 'expense' }}>지출</option>
                                    <option value="income"  {{ 'selected' if tx.type == 'income'  }}>수입</option>
                                </select>
                            </div>
                            <div class="col-6 col-md-3">
                                <input type="text" name="amount" value="{{ '{:,}'.format(tx.amount) }}"
                                       class="form-control form-control-sm" placeholder="금액" inputmode="numeric">
                            </div>
                            <div class="col-6 col-md-3">
                                <select name="card" class="form-select form-select-sm">
                                    <option value="">카드 없음</option>
                                    {% for card in card_list %}
                                    <option value="{{ card.name }}" {{ 'selected' if tx.card_matched == card.name }}>{{ card.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-8 col-md-9">
                                <input type="text" name="description" value="{{ tx.description }}"
                                       class="form-control form-control-sm" placeholder="설명">
                            </div>
                            <div class="col-4 col-md-3">
                                <select name="category" class="form-select form-select-sm cat-select" data-current="{{ tx.category }}">
                                    {% for cat in categories if cat.cat_type == tx.type %}
                                    <option value="{{ cat.name }}" {{ 'selected' if tx.category == cat.name }}>{{ cat.icon }} {{ cat.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}

                <div class="d-flex gap-2 justify-content-end mt-3">
                    <a href="/" class="btn btn-outline-secondary" style="border-radius:10px;">취소</a>
                    <button type="submit" class="btn" style="background:linear-gradient(135deg,#b088f9 0%,#7baff0 100%);color:white;border:none;border-radius:10px;">
                        <i class="bi bi-download"></i> 가져오기
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var expCats = {{ expense_cats_json | tojson }};
    var incCats = {{ income_cats_json | tojson }};

    function rebuildCatSelect(typeSelect) {
        var rowCard = typeSelect.closest('.row-card');
        var catSelect = rowCard.querySelector('.cat-select');
        if (!catSelect) return;
        var cats = typeSelect.value === 'expense' ? expCats : incCats;
        var prev = catSelect.dataset.current || catSelect.value;
        catSelect.innerHTML = cats.map(function(c) {
            return '<option value="' + c[0] + '"' + (c[0] === prev ? ' selected' : '') + '>' + c[1] + ' ' + c[0] + '</option>';
        }).join('');
        catSelect.dataset.current = '';
    }

    document.querySelectorAll('select[name="type"]').forEach(function(sel) {
        sel.addEventListener('change', function() { rebuildCatSelect(this); });
    });

    document.querySelectorAll('.row-check').forEach(function(cb) {
        cb.addEventListener('change', function() {
            var card = document.getElementById('rowcard-' + this.value);
            card.classList.toggle('excluded', !this.checked);
        });
    });
    document.getElementById('checkAll').addEventListener('change', function() {
        document.querySelectorAll('.row-check').forEach(function(cb) {
            cb.checked = document.getElementById('checkAll').checked;
            cb.dispatchEvent(new Event('change'));
        });
    });
    document.querySelectorAll('input[name="amount"]').forEach(function(input) {
        input.addEventListener('input', function() {
            var raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
            this.value = raw ? parseInt(raw).toLocaleString('ko-KR') : '';
        });
    });
    document.querySelectorAll('form').forEach(function(form) {
        form.addEventListener('submit', function() {
            form.querySelectorAll('input[name="amount"]').forEach(function(inp) {
                inp.value = inp.value.replace(/,/g, '');
            });
        });
    });
</script>
</body>
</html>
