<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}나의 가계부{% endblock %}</title>
  <link rel="icon" href="/static/icon-192.png?v=2" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f2f7;
      --bg-card: #ffffff;
      --bg-section: #f5f5f5;
      --bg-accent: rgba(176,136,249,0.08);
      --text-primary: #1c1c1e;
      --text-secondary: #3a3a3c;
      --text-muted: #8e8e93;
      --border: #e5e5ea;
      --border-input: #d1d1d6;
      --input-bg: #f5f5f5;
      --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-card: #2c2c2e;
        --bg-section: #3a3a3c;
        --bg-accent: rgba(176,136,249,0.12);
        --text-primary: #f5f5f7;
        --text-secondary: #d1d1d6;
        --text-muted: #8e8e93;
        --border: #3a3a3c;
        --border-input: #48484a;
        --input-bg: #3a3a3c;
        --shadow: 0 2px 16px rgba(0,0,0,0.3);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1c1c1e; --bg-card: #2c2c2e; --bg-section: #3a3a3c;
      --bg-accent: rgba(176,136,249,0.12); --text-primary: #f5f5f7;
      --text-secondary: #d1d1d6; --text-muted: #8e8e93; --border: #3a3a3c;
      --border-input: #48484a; --input-bg: #3a3a3c; --shadow: 0 2px 16px rgba(0,0,0,0.3);
    }
    :root[data-theme="light"] {
      --bg: #f2f2f7; --bg-card: #ffffff; --bg-section: #f5f5f5;
      --bg-accent: rgba(176,136,249,0.08); --text-primary: #1c1c1e;
      --text-secondary: #3a3a3c; --text-muted: #8e8e93; --border: #e5e5ea;
      --border-input: #d1d1d6; --input-bg: #f5f5f5; --shadow: 0 2px 16px rgba(0,0,0,0.07);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 24px);
      line-height: 1.5;
    }

    .app-nav-wrap {
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-nav {
      background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%);
      border-radius: 20px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(123,107,224,0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    @media (prefers-color-scheme: dark) {
      .app-nav { background: linear-gradient(135deg, #6b44b0 0%, #3d6aaa 100%); }
    }
    :root[data-theme="dark"] .app-nav { background: linear-gradient(135deg, #6b44b0 0%, #3d6aaa 100%); }
    :root[data-theme="light"] .app-nav { background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); }
    .app-nav-title {
      font-weight: 700;
      font-size: 1.25rem;
      color: white;
      text-shadow: 0 0 16px rgba(255,255,255,0.7);
    }
    @media (prefers-color-scheme: dark) {
      .app-nav-title { color: rgba(255,255,255,0.72); text-shadow: 0 0 10px rgba(255,255,255,0.25); }
    }
    :root[data-theme="dark"] .app-nav-title { color: rgba(255,255,255,0.72); text-shadow: 0 0 10px rgba(255,255,255,0.25); }
    :root[data-theme="light"] .app-nav-title { color: white; text-shadow: 0 0 16px rgba(255,255,255,0.7); }
    .app-nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .app-nav-btn {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: white; cursor: pointer; flex-shrink: 0;
    }
    .app-nav-house {
      display: flex; align-items: center;
      text-decoration: none; flex-shrink: 0;
      color: white;
    }
  </style>
  {% block head_css %}{% endblock %}
</head>
<body>

<div class="app-nav-wrap">
  <nav class="app-nav">
    <span class="app-nav-title">나의 가계부</span>
    <div class="app-nav-right">
      <button onclick="history.back()" class="app-nav-btn">
        <i class="bi bi-arrow-left" style="font-size:1.15rem;"></i>
      </button>
      <a href="/" class="app-nav-house">
        <i class="bi bi-house" style="font-size:1.6rem;text-shadow:0 0 12px rgba(255,255,255,0.6);"></i>
      </a>
    </div>
  </nav>
</div>

{% block content %}{% endblock %}

{% block scripts %}{% endblock %}

</body>
</html>
