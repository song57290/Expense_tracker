<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>내역 수정</title>
        <link rel="icon" href="/static/icon-192.png?v=2" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div id="topFade" class="d-lg-none" style="position: fixed; top: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to bottom, #f8f9fa 0%, rgba(248,249,250,0) 100%); z-index: 998; pointer-events: none; opacity: 0; transition: opacity 0.3s;"></div>
        <div id="bottomFade" class="d-lg-none" style="position: fixed; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(to top, #f8f9fa 0%, rgba(248,249,250,0) 100%); z-index: 998; pointer-events: none; opacity: 1; transition: opacity 0.3s;"></div>

        <div class="px-3 pt-3">
        <nav class="navbar mb-4" style="background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); border-radius: 20px; padding: 12px 20px; box-shadow: 0 4px 20px rgba(123,107,224,0.3);">
            <div class="d-flex align-items-center gap-3">
                <button onclick="toggleSidebar()" class="d-none d-lg-flex" style="align-items:center;justify-content:center;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;width:38px;height:38px;border-radius:10px;font-size:1.4rem;cursor:pointer;flex-shrink:0;">
                    <i class="bi bi-list"></i>
                </button>
                <a class="navbar-brand fw-bold fs-5 mb-0" href="/" style="color: white; text-shadow: 0 0 16px rgba(255,255,255,0.7);">나의 가계부</a>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button onclick="toggleSidebar()" class="d-lg-none" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;width:34px;height:34px;border-radius:9px;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="bi bi-bell"></i></button>
                <a href="/" class="d-lg-none" style="color: white;">
                    <i class="bi bi-house" style="font-size: 1.6rem; text-shadow: 0 0 12px rgba(255,255,255,0.6);"></i>
                </a>
                <a href="/" class="d-none d-lg-flex" style="align-items:center;justify-content:center;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;width:38px;height:38px;border-radius:10px;transition:background 0.15s;">
                    <i class="bi bi-house" style="font-size:1.2rem;"></i>
                </a>
            </div>
        </nav>
        </div>

        <div class="container-fluid px-3 px-lg-4 pb-lg-0">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">내역 수정</h5>
                    <!-- 기존 값을 value에 미리 채워서 보여줌 -->
                    <form action="/edit/{{ tx.id }}" method="post" class="row g-2">
                        <div class="col-6 col-lg-2">
                            <input type="date" name="date" value="{{ tx.date }}" class="form-control" required>
                        </div>
                        <div class="col-6 col-lg-2">
                            <select name="type" id="editTypeSelect" class="form-select">
                                <option value="expense" {% if tx.type == 'expense' %}selected{% endif %}>지출</option>
                                <option value="income" {% if tx.type == 'income' %}selected{% endif %}>수입</option>
                            </select>
                        </div>
                        <div class="col-6 col-lg-2">
                            <select name="category" id="editCatSelect" class="form-select"></select>
                        </div>
                        <div class="col-6 col-lg-2">
                            <input type="text" name="amount" value="{{ tx.amount }}" class="form-control" inputmode="numeric">
                        </div>
                        <div class="col-12 col-lg-2">
                            <input type="text" name="description" value="{{ tx.description }}" class="form-control" placeholder="항목 설명">
                        </div>
                        <div class="col-12 col-lg-2">
                            <select name="card" class="form-select" required>
                                <option value="">카드 선택</option>
                                {% for card in card_list %}
                                <option value="{{ card.name }}" {% if tx.card == card.name %}selected{% endif %}>{{ card.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <!-- 저장/취소 버튼 오른쪽 정렬 -->
                        <div class="col-12 d-flex justify-content-between gap-2 mt-3">
                            <form action="/delete/{{ tx.id }}" method="post" onsubmit="return confirm('이 내역을 삭제할까요?')">
                                <button type="submit" class="btn btn-outline-danger">삭제</button>
                            </form>
                            <div class="d-flex gap-2">
                                <button type="submit" id="saveBtn" class="btn" style="background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); color: white; border: none; border-radius: 10px;">저장</button>
                                <a href="/" class="btn btn-outline-secondary">취소</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="d-lg-none" style="height: 90px;"></div>
        </div>
        <nav class="d-lg-none" style="position: fixed; bottom: 16px; left: 16px; right: 16px; background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); border-radius: 20px; box-shadow: 0 4px 20px rgba(123,107,224,0.3); z-index: 1000; overflow: hidden;">
            <div class="d-flex justify-content-around py-2">
                <a href="/cards" class="text-center text-decoration-none" style="color: white; padding: 4px 8px; border: 1px solid transparent;">
                    <i class="bi bi-credit-card fs-5 d-block"></i>
                    <small style="font-size: 10px;">카드</small>
                </a>
                <a href="/calendar" class="text-center text-decoration-none" style="color: white; padding: 4px 8px; border: 1px solid transparent;">
                    <i class="bi bi-calendar3 fs-5 d-block"></i>
                    <small style="font-size: 10px;">캘린더</small>
                </a>
                <a href="/stats" class="text-center text-decoration-none" style="color: white; padding: 4px 8px; border: 1px solid transparent;">
                    <i class="bi bi-pie-chart fs-5 d-block"></i>
                    <small style="font-size: 10px;">통계</small>
                </a>
                <a href="/budget" class="text-center text-decoration-none" style="color: white; padding: 4px 8px; border: 1px solid transparent;">
                    <i class="bi bi-wallet2 fs-5 d-block"></i>
                    <small style="font-size: 10px;">예산</small>
                </a>
                <a href="/categories" class="text-center text-decoration-none" style="color: white; padding: 4px 8px; border: 1px solid transparent;">
                    <i class="bi bi-grid fs-5 d-block"></i>
                    <small style="font-size: 10px;">목록</small>
                </a>
            </div>
        </nav>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            (function() {
                var expCats = {{ expense_cats_json | tojson }};
                var incCats = {{ income_cats_json | tojson }};
                var curCat = '{{ tx.category | e }}';
                function fillCats(typeVal) {
                    var cats = typeVal === 'expense' ? expCats : incCats;
                    var sel = document.getElementById('editCatSelect');
                    sel.innerHTML = cats.map(function(c) {
                        return '<option value="' + c[0] + '"' + (c[0] === curCat ? ' selected' : '') + '>' + c[1] + ' ' + c[0] + '</option>';
                    }).join('');
                    curCat = '';
                }
                var typeEl = document.getElementById('editTypeSelect');
                typeEl.addEventListener('change', function() { fillCats(this.value); });
                fillCats(typeEl.value);
            })();
        </script>
        <script>
            var topFade = document.getElementById('topFade');
            var bottomFade = document.getElementById('bottomFade');
            function updateFades() {
                var scrollY = window.scrollY;
                var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                if (topFade) topFade.style.opacity = scrollY > 30 ? '1' : '0';
                if (bottomFade) bottomFade.style.opacity = maxScroll > 0 && (maxScroll - scrollY) > 30 ? '1' : '0';
            }
            window.addEventListener('scroll', updateFades);
            window.addEventListener('resize', updateFades);
            updateFades();
            document.querySelectorAll('input[name="amount"]').forEach(function(input) {
                if (input.value) {
                    var r = input.value.replace(/,/g, '');
                    if (r !== '' && !isNaN(r)) input.value = parseInt(r).toLocaleString('ko-KR');
                }
                input.addEventListener('input', function() {
                    var raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                    this.value = raw !== '' ? parseInt(raw).toLocaleString('ko-KR') : '';
                });
            });
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', function() {
                    form.querySelectorAll('input[name="amount"]').forEach(function(inp) {
                        inp.value = inp.value.replace(/,/g, '');
                    });
                });
            });
        </script>
        <div id="sidebarOverlay" onclick="closeSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1500;"></div>
        <div id="pcSidebar" style="position:fixed;top:0;left:-280px;width:260px;height:100%;background:white;z-index:1600;box-shadow:4px 0 24px rgba(0,0,0,0.15);border-radius:0 20px 20px 0;transition:left 0.3s cubic-bezier(0.25,0.46,0.45,0.94);overflow:hidden;">
            <div style="background:linear-gradient(135deg,#b088f9 0%,#7baff0 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;">
                <span style="color:white;font-weight:700;font-size:1.05rem;text-shadow:0 0 12px rgba(255,255,255,0.5);">나의 가계부</span>
                <button onclick="closeSidebar()" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;width:32px;height:32px;border-radius:8px;font-size:0.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;"><i class="bi bi-x-lg"></i></button>
            </div>
            <div style="padding:12px 8px;">
                <a href="/" class="pc-sb-link"><i class="bi bi-house"></i><span>홈</span></a>
                <a href="/cards" class="pc-sb-link"><i class="bi bi-credit-card"></i><span>카드 관리</span></a>
                <a href="/calendar" class="pc-sb-link"><i class="bi bi-calendar3"></i><span>캘린더</span></a>
                <a href="/stats" class="pc-sb-link"><i class="bi bi-pie-chart"></i><span>통계</span></a>
                <a href="/budget" class="pc-sb-link"><i class="bi bi-wallet2"></i><span>예산 설정</span></a>
                <a href="/categories" class="pc-sb-link"><i class="bi bi-grid"></i><span>카테고리</span></a>
                <hr style="margin:8px 4px;border-color:#f0f0f0;">
                <div style="padding:2px 8px 8px;">
                    <div style="font-size:0.77rem;color:#aaa;padding:2px 8px 6px;">알림 설정</div>
                    <div style="display:flex;align-items:center;gap:8px;padding:0 8px 4px;">
                        <i class="bi bi-bell" style="font-size:1.1rem;color:#b088f9;width:22px;text-align:center;flex-shrink:0;"></i>
                        <input type="time" id="notifyTime" value="21:00" style="flex:1;border:1px solid #e0e0e0;border-radius:8px;padding:5px 8px;font-size:0.84rem;color:#333;outline:none;">
                        <button id="notifyBtn" onclick="toggleNotify()" style="background:#b088f9;color:white;border:none;border-radius:8px;padding:5px 11px;font-size:0.82rem;cursor:pointer;white-space:nowrap;">설정</button>
                    </div>
                    <div id="notifyStatus" style="font-size:0.74rem;color:#888;padding:2px 8px 0 38px;"></div>
                </div>
            </div>
        </div>
        <style>.pc-sb-link{display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:12px;color:#333;text-decoration:none;font-size:0.93rem;margin-bottom:2px;transition:background 0.15s;}.pc-sb-link:hover{background:#f0eeff;color:#b088f9;}.pc-sb-link i{font-size:1.15rem;color:#b088f9;width:22px;text-align:center;flex-shrink:0;}</style>
        <script>
        function toggleSidebar(){var sb=document.getElementById('pcSidebar'),ov=document.getElementById('sidebarOverlay');if(sb.style.left==='0px'){sb.style.left='-280px';ov.style.display='none';}else{sb.style.left='0px';ov.style.display='block';}}
        function closeSidebar(){document.getElementById('pcSidebar').style.left='-280px';document.getElementById('sidebarOverlay').style.display='none';}
        document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSidebar();});
        </script>
        <script src="/static/push.js"></script>
    </body>
</html>
