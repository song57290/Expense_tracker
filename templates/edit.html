<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>내역 수정</title>
        <link rel="icon" href="/static/icon-192.png?v=2" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar mb-4" style="background: rgba(255,255,255,0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.08); box-shadow: 0 2px 16px rgba(0,0,0,0.06);">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="/" style="color: #1a1a2e;">나의 가계부</a>
                <a href="/" class="d-md-none">
                    <img src="/static/home_icon.png" width="36" height="36" style="border-radius: 10px;">
                </a>
                <div class="d-none d-md-flex gap-1">
                    <a href="/cards" class="btn btn-outline-secondary btn-sm">카드 관리</a>
                    <a href="/calendar" class="btn btn-outline-secondary btn-sm">캘린더</a>
                    <a href="/stats" class="btn btn-outline-secondary btn-sm">카테고리 통계</a>
                    <a href="/budget" class="btn btn-outline-secondary btn-sm">예산 설정</a>
                </div>
            </div>
        </nav>

        <div class="container pb-5 pb-md-0">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">내역 수정</h5>
                    <!-- 기존 값을 value에 미리 채워서 보여줌 -->
                    <form action="/edit/{{ tx.id }}" method="post" class="row g-2">
                        <div class="col-md-2">
                            <input type="date" name="date" value="{{ tx.date }}" class="form-control" required>
                        </div>
                        <div class="col-md-2">
                            <select name="type" class="form-select">
                                <!-- 기존 유형에 selected를 붙여서 현재 값이 선택된 상태로 보여줌 -->
                                <option value="expense" {% if tx.type == 'expense' %}selected{% endif %}>지출</option>
                                <option value="income" {% if tx.type == 'income' %}selected{% endif %}>수입</option>
                            </select>
                        </div>
                        <!-- 드롭 박스 형식 - 기존 카테고리와 일치하는 항목이 선택된 상태로 보여줌 -->
                        <div class="col-md-2">
                            <select name="category" class="form-select">
                                <option value="식사" {% if tx.category == '식사' %}selected{% endif %}>🍚 식사</option>
                                <option value="간식" {% if tx.category == '간식' %}selected{% endif %}>🍪 간식</option>
                                <option value="쇼핑" {% if tx.category == '쇼핑' %}selected{% endif %}>🛍️ 쇼핑</option>
                                <option value="자동차" {% if tx.category == '자동차' %}selected{% endif %}>🚗 자동차</option>
                                <option value="교통" {% if tx.category == '교통' %}selected{% endif %}>🚌 교통</option>
                                <option value="의료" {% if tx.category == '의료' %}selected{% endif %}>💊 의료</option>
                                <option value="기타" {% if tx.category == '기타' %}selected{% endif %}>📦 기타</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="text" name="description" value="{{ tx.description }}" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <input type="number" name="amount" value="{{ tx.amount }}" class="form-control">
                        </div>
                        <!-- 카드 선택 - 기존 카드가 선택된 상태로 보여줌 -->
                        <div class="col-md-2">
                            <select name="card" class="form-select" required>
                                <option value="">카드 선택</option>
                                {% for card in card_list %}
                                <option value="{{ card.name }}" {% if tx.card == card.name %}selected{% endif %}>{{ card.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <!-- 저장/취소 버튼 오른쪽 정렬 -->
                        <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                            <button type="submit" id="saveBtn" class="btn btn-primary">저장</button>
                            <a href="/" class="btn btn-outline-secondary">취소</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <nav class="d-md-none fixed-bottom" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.1); z-index: 1000;">
            <div class="d-flex justify-content-around py-2">
                <a href="/" class="text-center text-decoration-none" style="color: #555;">
                    <img src="/static/home_icon.png" width="24" height="24" style="border-radius: 6px; display: block; margin: 0 auto 2px;">
                    <small style="font-size: 10px;">홈</small>
                </a>
                <a href="/cards" class="text-center text-decoration-none" style="color: #555;">
                    <i class="bi bi-credit-card fs-5 d-block"></i>
                    <small style="font-size: 10px;">카드</small>
                </a>
                <a href="/calendar" class="text-center text-decoration-none" style="color: #555;">
                    <i class="bi bi-calendar3 fs-5 d-block"></i>
                    <small style="font-size: 10px;">캘린더</small>
                </a>
                <a href="/stats" class="text-center text-decoration-none" style="color: #555;">
                    <i class="bi bi-pie-chart fs-5 d-block"></i>
                    <small style="font-size: 10px;">통계</small>
                </a>
                <a href="/budget" class="text-center text-decoration-none" style="color: #555;">
                    <i class="bi bi-wallet2 fs-5 d-block"></i>
                    <small style="font-size: 10px;">예산</small>
                </a>
            </div>
        </nav>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
