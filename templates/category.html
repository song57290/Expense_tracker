<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>카테고리 관리</title>
        <!-- Bootstrap CSS - 이걸 추가하면 Bootstrap 스타일 사용 가능 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <!-- 상단 네비게이션 바 -->
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand">나의 가계부</span>
            </div>
        </nav>

        <div class="container">
            <!-- 카테고리 추가 폼 -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">카테고리 추가</h5>
                    <form action="/categories" method="post" class="row g-2">
                        <div class="col-md-2">
                            <input type="text" name="icon" class="form-control" placeholder="이모지 (예: 🍚)">
                        </div>
                        <div class="col-md-4">
                            <input type="text" name="name" class="form-control" placeholder="카테고리 이름">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn btn-primary w-100">추가</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 카테고리 목록 -->
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">카테고리 목록</h5>
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>이모지</th>
                                <th>이름</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for cat in categories %} <!-- DB에서 가져온 카테고리 반복 -->
                            <tr>
                                <td>{{ cat.icon }}</td>
                                <td>{{ cat.name }}</td>
                                <td>
                                    <form action="/categories/delete/{{ cat.id }}" method="post" style="display:inline">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                                    </form>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <a href="/" class="btn btn-outline-secondary mt-3">홈으로</a>
        </div>
    </body>
</html>
