<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>캘린더</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- FullCalendar - 캘린더 라이브러리 -->
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
        <style>
            /* 이벤트 바 스타일 - 간격과 둥근 모서리 */
            .fc-event {
                border-radius: 6px !important;
                margin: 5px 8px !important;
                padding: 3px 8px !important;
                font-size: 0.8em !important;
                border: none !important;
            }
            /* 평일 헤더 및 날짜 검은색 */
            .fc-col-header-cell a,
            .fc-daygrid-day-number {
                color: #333 !important;
                text-decoration: none !important;
            }
            /* 요일 색상 - 토요일 파란색, 일요일 빨간색 */
            .fc-col-header-cell.fc-day-sat a,
            .fc-daygrid-day.fc-day-sat .fc-daygrid-day-number {
                color: #2196F3 !important;
            }
            .fc-col-header-cell.fc-day-sun a,
            .fc-daygrid-day.fc-day-sun .fc-daygrid-day-number {
                color: #F44336 !important;
            }
            /* 캘린더 버튼 색상 */
            .fc-button-primary {
                background-color: #4A90D9 !important;
                border: 2px solid #2c6fad !important;
                border-radius: 6px !important;
                margin: 0 3px !important;
            }
            .fc-button-primary:hover {
                background-color: #357ABD !important;
                border-color: #1f5080 !important;
            }
            .fc-button-primary:focus {
                box-shadow: none !important;
            }
            /* 연월 제목 가운데, 버튼 오른쪽 */
            .fc-toolbar-chunk:first-child { flex: 1; }
            .fc-toolbar-chunk:nth-child(2) { flex: 1; text-align: center; }
            .fc-toolbar-chunk:last-child { flex: 1; display: flex; justify-content: flex-end; }
        </style>
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="/">나의 가계부</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <div class="ms-auto mt-2 mt-md-0 d-flex flex-column flex-md-row gap-1">
                        <a href="/cards" class="btn btn-outline-light btn-sm">카드 관리</a>
                        <a href="/calendar" class="btn btn-outline-light btn-sm">캘린더</a>
                        <a href="/stats" class="btn btn-outline-light btn-sm">카테고리 통계</a>
                        <a href="/budget" class="btn btn-outline-light btn-sm">예산 설정</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="container">
            <div class="card">
                <div class="card-body">
                    <div id="calendar"></div>
                </div>
            </div>
        </div>

        <!-- 내역 추가 모달 -->
        <div class="modal fade" id="addModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">내역 추가</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form action="/add" method="post">
                        <input type="hidden" name="next" value="/calendar">
                        <div class="modal-body d-flex flex-column gap-2">
                            <input type="date" name="date" id="modalDate" class="form-control" required>
                            <select name="type" class="form-select">
                                <option value="expense">지출</option>
                                <option value="income">수입</option>
                            </select>
                            <select name="category" class="form-select">
                                <option value="식사">🍚 식사</option>
                                <option value="간식">🍪 간식</option>
                                <option value="쇼핑">🛍️ 쇼핑</option>
                                <option value="자동차">🚗 자동차</option>
                                <option value="교통">🚌 교통</option>
                                <option value="의료">💊 의료</option>
                                <option value="기타">📦 기타</option>
                            </select>
                            <input type="text" name="description" class="form-control" placeholder="항목 설명">
                            <input type="number" name="amount" class="form-control" placeholder="금액" required>
                            <select name="card" class="form-select" required>
                                <option value="">카드 선택</option>
                                {% for card in card_list %}
                                <option value="{{ card.name }}">{{ card.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Flask에서 받은 내역 데이터
            const events = {{ events | tojson }};

            // 캘린더 생성
            document.addEventListener('DOMContentLoaded', function() {
                const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'ko',
                    headerToolbar: {
                        left: 'today',
                        center: 'title',
                        right: 'prev next'
                    },
                    buttonText: {
                        today: '오늘',
                        prev: '‹',
                        next: '›'
                    },
                    height: 'auto',
                    fixedWeekCount: false,
                    showNonCurrentDates: false,
                    events: events,
                    dateClick: function(info) {
                        document.getElementById('modalDate').value = info.dateStr;
                        new bootstrap.Modal(document.getElementById('addModal')).show();
                    },
                    eventClick: function(info) {
                        alert(info.event.title);
                    }
                });
                calendar.render();
            });
        </script>
    </body>
</html>
