<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>캘린더</title>
        <link rel="icon" href="/static/icon-192.png?v=2" type="image/png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
        <!-- FullCalendar - 캘린더 라이브러리 -->
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
        <style>
            /* 이벤트 바 스타일 - 간격과 둥근 모서리 */
            .fc-event {
                border-radius: 6px !important;
                margin: 5px 8px !important;
                padding: 3px 8px !important;
                font-size: 0.8em !important;
                border: none !important;
            }
            /* 평일 헤더 및 날짜 검은색 */
            .fc-col-header-cell a,
            .fc-daygrid-day-number {
                color: #333 !important;
                text-decoration: none !important;
            }
            /* 요일 색상 - 토요일 파란색, 일요일 빨간색 */
            .fc-col-header-cell.fc-day-sat a,
            .fc-daygrid-day.fc-day-sat .fc-daygrid-day-number {
                color: #2196F3 !important;
            }
            .fc-col-header-cell.fc-day-sun a,
            .fc-daygrid-day.fc-day-sun .fc-daygrid-day-number {
                color: #F44336 !important;
            }
            /* 캘린더 버튼 색상 */
            .fc-button-primary {
                background-color: #4A90D9 !important;
                border: 2px solid #2c6fad !important;
                border-radius: 6px !important;
                margin: 0 1px !important;
            }
            .fc-button-primary:hover {
                background-color: #357ABD !important;
                border-color: #1f5080 !important;
            }
            .fc-button-primary:focus {
                box-shadow: none !important;
            }
            /* 연월 제목 가운데, 버튼 오른쪽 */
            .fc-toolbar-chunk:first-child { flex: 1; }
            .fc-toolbar-chunk:nth-child(2) { flex: 1; text-align: center; }
            .fc-toolbar-chunk:last-child { flex: 1; display: flex; justify-content: flex-end; }
        </style>
    </head>
    <body class="bg-light">
        <div id="topFade" class="d-md-none" style="position: fixed; top: 0; left: 0; right: 0; height: 80px; background: linear-gradient(to bottom, #f8f9fa 0%, rgba(248,249,250,0) 100%); z-index: 998; pointer-events: none; opacity: 0; transition: opacity 0.3s;"></div>
        <div id="bottomFade" class="d-md-none" style="position: fixed; bottom: 0; left: 0; right: 0; height: 110px; background: linear-gradient(to top, #f8f9fa 0%, rgba(248,249,250,0) 100%); z-index: 998; pointer-events: none; opacity: 1; transition: opacity 0.3s;"></div>

        <div class="px-3 pt-3">
        <nav class="navbar mb-4" style="background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); border-radius: 20px; padding: 12px 20px; box-shadow: 0 4px 20px rgba(123,107,224,0.3);">
            <a class="navbar-brand fw-bold fs-5" href="/" style="color: white; text-shadow: 0 0 16px rgba(255,255,255,0.7);">나의 가계부</a>
            <a href="/" class="d-md-none" style="color: white;">
                <i class="bi bi-house" style="font-size: 1.6rem; text-shadow: 0 0 12px rgba(255,255,255,0.6);"></i>
            </a>
            <div class="d-none d-md-flex gap-1">
                <a href="/cards" class="btn btn-sm" style="color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px;">카드 관리</a>
                <a href="/calendar" class="btn btn-sm" style="color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px;">캘린더</a>
                <a href="/stats" class="btn btn-sm" style="color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px;">카테고리 통계</a>
                <a href="/budget" class="btn btn-sm" style="color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px;">예산 설정</a>
            </div>
        </nav>
        </div>

        <div class="container pb-md-0">
            <div class="card">
                <div class="card-body">
                    <div id="calendar"></div>
                </div>
            </div>
            <div class="d-md-none" style="height: 90px;"></div>
        </div>

        <!-- 내역 추가 모달 -->
        <div class="modal fade" id="addModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">내역 추가</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form action="/add" method="post">
                        <input type="hidden" name="next" value="/calendar">
                        <div class="modal-body d-flex flex-column gap-2">
                            <input type="date" name="date" id="modalDate" class="form-control" required>
                            <select name="type" class="form-select">
                                <option value="expense">지출</option>
                                <option value="income">수입</option>
                            </select>
                            <select name="category" class="form-select">
                                <option value="식사">🍚 식사</option>
                                <option value="간식">🍪 간식</option>
                                <option value="쇼핑">🛍️ 쇼핑</option>
                                <option value="자동차">🚗 자동차</option>
                                <option value="교통">🚌 교통</option>
                                <option value="의료">💊 의료</option>
                                <option value="기타">📦 기타</option>
                            </select>
                            <input type="text" name="description" class="form-control" placeholder="항목 설명">
                            <input type="text" name="amount" class="form-control" placeholder="금액" inputmode="numeric" required>
                            <select name="card" class="form-select" required>
                                <option value="">카드 선택</option>
                                {% for card in card_list %}
                                <option value="{{ card.name }}">{{ card.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn" style="background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); color: white; border: none; border-radius: 10px;">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <nav class="d-md-none" style="position: fixed; bottom: 16px; left: 16px; right: 16px; background: linear-gradient(135deg, #b088f9 0%, #7baff0 100%); border-radius: 20px; box-shadow: 0 4px 20px rgba(123,107,224,0.3); z-index: 1000;">
            <div class="d-flex justify-content-around py-2">
                <a href="/" class="text-center text-decoration-none" style="color: white;">
                    <i class="bi bi-house fs-5 d-block"></i>
                    <small style="font-size: 10px;">홈</small>
                </a>
                <a href="/cards" class="text-center text-decoration-none" style="color: white;">
                    <i class="bi bi-credit-card fs-5 d-block"></i>
                    <small style="font-size: 10px;">카드</small>
                </a>
                <a href="/calendar" class="text-center text-decoration-none" style="color: white;">
                    <i class="bi bi-calendar3 fs-5 d-block"></i>
                    <small style="font-size: 10px;">캘린더</small>
                </a>
                <a href="/stats" class="text-center text-decoration-none" style="color: white;">
                    <i class="bi bi-pie-chart fs-5 d-block"></i>
                    <small style="font-size: 10px;">통계</small>
                </a>
                <a href="/budget" class="text-center text-decoration-none" style="color: white;">
                    <i class="bi bi-wallet2 fs-5 d-block"></i>
                    <small style="font-size: 10px;">예산</small>
                </a>
            </div>
        </nav>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Flask에서 받은 내역 데이터
            const events = {{ events | tojson }};

            // 캘린더 생성
            document.addEventListener('DOMContentLoaded', function() {
                const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'ko',
                    headerToolbar: {
                        left: 'today',
                        center: 'title',
                        right: 'prev next'
                    },
                    buttonText: {
                        today: '오늘',
                        prev: '‹',
                        next: '›'
                    },
                    height: 'auto',
                    fixedWeekCount: false,
                    showNonCurrentDates: false,
                    events: events,
                    dateClick: function(info) {
                        document.getElementById('modalDate').value = info.dateStr;
                        new bootstrap.Modal(document.getElementById('addModal')).show();
                    },
                    eventClick: function(info) {
                        alert(info.event.title);
                    }
                });
                calendar.render();
            });
        </script>
        <script>
            var topFade = document.getElementById('topFade');
            var bottomFade = document.getElementById('bottomFade');
            function updateFades() {
                var scrollY = window.scrollY;
                var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                if (topFade) topFade.style.opacity = scrollY > 30 ? '1' : '0';
                if (bottomFade) bottomFade.style.opacity = maxScroll > 0 && (maxScroll - scrollY) > 30 ? '1' : '0';
            }
            window.addEventListener('scroll', updateFades);
            window.addEventListener('resize', updateFades);
            updateFades();
            document.querySelectorAll('input[name="amount"]').forEach(function(input) {
                if (input.value) {
                    var r = input.value.replace(/,/g, '');
                    if (r !== '' && !isNaN(r)) input.value = parseInt(r).toLocaleString('ko-KR');
                }
                input.addEventListener('input', function() {
                    var raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                    this.value = raw !== '' ? parseInt(raw).toLocaleString('ko-KR') : '';
                });
            });
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', function() {
                    form.querySelectorAll('input[name="amount"]').forEach(function(inp) {
                        inp.value = inp.value.replace(/,/g, '');
                    });
                });
            });
        </script>
    </body>
</html>
