<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>캘린더</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- FullCalendar - 캘린더 라이브러리 -->
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
        <style>
            /* 이벤트 바 스타일 - 간격과 둥근 모서리 */
            .fc-event {
                border-radius: 6px !important;
                margin: 5px 8px !important;
                padding: 3px 8px !important;
                font-size: 0.8em !important;
                border: none !important;
            }
            /* 평일 헤더 및 날짜 검은색 */
            .fc-col-header-cell a,
            .fc-daygrid-day-number {
                color: #333 !important;
                text-decoration: none !important;
            }
            /* 요일 색상 - 토요일 파란색, 일요일 빨간색 */
            .fc-col-header-cell.fc-day-sat a,
            .fc-daygrid-day.fc-day-sat .fc-daygrid-day-number {
                color: #2196F3 !important;
            }
            .fc-col-header-cell.fc-day-sun a,
            .fc-daygrid-day.fc-day-sun .fc-daygrid-day-number {
                color: #F44336 !important;
            }
            /* 캘린더 버튼 색상 */
            .fc-button-primary {
                background-color: #4A90D9 !important;
                border-color: #4A90D9 !important;
            }
            .fc-button-primary:hover {
                background-color: #357ABD !important;
                border-color: #357ABD !important;
            }
            .fc-button-primary:focus {
                box-shadow: none !important;
            }
            /* 연월 제목 가운데, 버튼 오른쪽 */
            .fc-toolbar-chunk:first-child { flex: 1; }
            .fc-toolbar-chunk:nth-child(2) { flex: 1; text-align: center; }
            .fc-toolbar-chunk:last-child { flex: 1; display: flex; justify-content: flex-end; }
        </style>
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand">나의 가계부</span>
                <a href="/" class="btn btn-outline-light btn-sm">홈으로</a>
            </div>
        </nav>

        <div class="container">
            <div class="card">
                <div class="card-body">
                    <!-- 캘린더가 그려질 영역 -->
                    <div id="calendar"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // Flask에서 받은 내역 데이터
            const events = {{ events | tojson }};

            // 캘린더 생성
            document.addEventListener('DOMContentLoaded', function() {
                const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'ko',
                    headerToolbar: {
                        left: 'today',
                        center: 'title',
                        right: 'prev,next'
                    },
                    buttonText: {
                        today: '오늘',
                        prev: '‹',
                        next: '›'
                    },
                    events: events,
                    eventClick: function(info) {
                        alert(info.event.title);
                    }
                });
                calendar.render();
            });
        </script>
    </body>
</html>
