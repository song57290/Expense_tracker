<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#fff"/>
  <!-- 건(乾) 상단왼쪽 -->
  <g transform="translate(3.5,2.5) rotate(-45,4,4)">
    <rect x="0" y="0" width="8" height="1.2" fill="#000"/>
    <rect x="0" y="2.2" width="8" height="1.2" fill="#000"/>
    <rect x="0" y="4.4" width="8" height="1.2" fill="#000"/>
  </g>
  <!-- 곤(坤) 상단오른쪽 -->
  <g transform="translate(18.5,2.5) rotate(-45,4,4)">
    <rect x="0" y="0" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="0" width="3.5" height="1.2" fill="#000"/>
    <rect x="0" y="2.2" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="2.2" width="3.5" height="1.2" fill="#000"/>
    <rect x="0" y="4.4" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="4.4" width="3.5" height="1.2" fill="#000"/>
  </g>
  <!-- 감(坎) 하단왼쪽 -->
  <g transform="translate(3.5,12.5) rotate(-45,4,4)">
    <rect x="0" y="0" width="8" height="1.2" fill="#000"/>
    <rect x="0" y="2.2" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="2.2" width="3.5" height="1.2" fill="#000"/>
    <rect x="0" y="4.4" width="8" height="1.2" fill="#000"/>
  </g>
  <!-- 이(離) 하단오른쪽 -->
  <g transform="translate(18.5,12.5) rotate(-45,4,4)">
    <rect x="0" y="0" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="0" width="3.5" height="1.2" fill="#000"/>
    <rect x="0" y="2.2" width="8" height="1.2" fill="#000"/>
    <rect x="0" y="4.4" width="3.5" height="1.2" fill="#000"/>
    <rect x="4.5" y="4.4" width="3.5" height="1.2" fill="#000"/>
  </g>
  <!-- 태극 빨간 반 -->
  <path d="M15,5 a5,5 0 0,1 0,10 a2.5,2.5 0 0,0 0,-5 a2.5,2.5 0 0,1 0,-5 z" fill="#C60C30"/>
  <!-- 태극 파란 반 -->
  <path d="M15,5 a5,5 0 0,0 0,10 a2.5,2.5 0 0,1 0,-5 a2.5,2.5 0 0,0 0,-5 z" fill="#003478"/>
  <circle cx="15" cy="7.5" r="1.25" fill="#C60C30"/>
  <circle cx="15" cy="12.5" r="1.25" fill="#003478"/>
</svg>
